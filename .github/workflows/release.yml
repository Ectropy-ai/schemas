name: release

# Publishes @ectropy/schemas when a tag v<version> matching package.json is pushed.
# npm trusted publishing: npm exchanges this job's OIDC token for a one-time publish
# credential (no stored npm token) and attaches provenance linking the package to this
# workflow run. The trusted publisher on npmjs.com names this repository, this workflow file
# and the npm-publish environment.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: The tag is the package version
        run: |
          v="$(node -p "require('./package.json').version")"
          [ "${GITHUB_REF_NAME}" = "v${v}" ] || { echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${v}"; exit 1; }
      - name: npm that supports trusted publishing
        run: npm install -g npm@11.5.1
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm publish --provenance --access public
